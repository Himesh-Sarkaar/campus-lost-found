<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a href="#" id="logoutLink">Logout</a></nav>
  <div class="container">
    <h1>My Dashboard</h1>
    
    <h2 style="margin-top: 2rem;">Report New Item</h2>
    <form id="reportForm">
      <div class="form-group"><label>Item Name</label><input type="text" id="itemName" required></div>
      <div class="form-group"><label>Category</label>
        <select id="itemCategory" required>
            <option value="Electronics">Electronics</option>
            <option value="Books">Books</option>
            <option value="Clothing">Clothing</option>
            <option value="ID Cards">ID Cards</option>
            <option value="Other">Other</option>
        </select>
      </div>
      <div class="form-group"><label>Description</label><textarea id="itemDescription" required></textarea></div>
      <div class="form-group"><label>Location</label><input type="text" id="itemLocation" required></div>
      <div class="form-group"><label>Date</label><input type="date" id="itemDate" required></div>
      <div class="form-group"><label>Type</label>
        <select id="itemType" required>
            <option value="lost">Lost</option>
            <option value="found">Found</option>
        </select>
      </div>
      <div class="form-group"><label>Image URL (optional)</label><input type="text" id="itemImage"></div>
      
      <!-- SUBMIT BUTTON IS HERE AND VISIBLE -->
      <button type="submit" style="width: 100%; font-size: 1.1rem;">Submit Item Report</button>
    </form>

    <h2 style="margin-top: 3rem;">My Listings</h2>
    <div id="myItems"></div>
    
    <h2 style="margin-top: 3rem;">My Claims & Proofs</h2>
    <div id="myClaims"></div>
  </div>
  <script src="js/dashboard.js"></script>
</body>
</html>
