<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Lost & Found</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a>
    <a href="login.html" id="loginLink">Login</a>
    <a href="register.html" id="registerLink">Register</a>
    <a href="dashboard.html" id="dashboardLink" style="display:none;">Dashboard</a>
    <a href="admin.html" id="adminLink" style="display:none;">Admin</a>
    <a href="#" id="logoutLink" style="display:none;">Logout</a>
  </nav>
  <div class="container">
    <h1>Campus Lost & Found Portal</h1>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search items...">
      <select id="categoryFilter">
        <option value="">All Categories</option><option value="Electronics">Electronics</option><option value="Books">Books</option><option value="Clothing">Clothing</option><option value="ID Cards">ID Cards</option><option value="Other">Other</option>
      </select>
      <select id="locationFilter">
        <option value="">All Locations</option><option value="Library">Library</option><option value="Cafeteria">Cafeteria</option><option value="Main Building">Main Building</option><option value="Sports Complex">Sports Complex</option>
      </select>
      <select id="typeFilter">
        <option value="">All Types</option><option value="lost">Lost</option><option value="found">Found</option>
      </select>
      <button id="searchBtn">Search</button>
    </div>
    <div id="itemsList" class="items-grid"></div>
  </div>
  <script src="js/main.js"></script>
</body>
</html>
